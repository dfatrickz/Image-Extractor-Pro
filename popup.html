<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Extractor Pro</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-body">
    <main class="popup-shell surface">
      <section class="popup-hero">
        <p class="eyebrow">Image Extractor Pro</p>
        <h1>Bulk image extraction in one click.</h1>
        <p class="subtle">
          Scan the current page, trigger lazy-loaded assets, and open a full review gallery before download.
        </p>
      </section>

      <button id="extractButton" class="primary-button button-large" type="button">
        <span class="button-label">Extract Images</span>
        <span class="button-spinner" aria-hidden="true"></span>
      </button>

      <section class="status-card surface-soft" aria-live="polite">
        <p id="statusText">Ready to scan the active tab.</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
